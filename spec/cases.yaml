# SENDGUARD frozen case table (S01).
# N12 hard rule: samples are stored as UTF-8 hex ONLY; a forbidden-name sample
# is NEVER materialized as a real file in this repo.
# All comments in English (M21). No real usernames/emails/company names (Qoder e).
format_version: 1
freeze_revision: 2
frozen_at: "2026-10-10"
rev2_note: "2026-10-10 defect fix (P0, freeze-blocking): 9 corrupted sample hex values
  replaced with correct UTF-8 hex per evidence/S02/defects/sample-corruption.md
  (T06/T07/T09a/T09b/T12/T13/T15/T19a/T19b). No trap id, category, locale, or
  applicability changed. Old sha256 recorded in spec/FROZEN.md rev2 changelog."
seed_blind_samples: "7f3c1a9e5b2d8f40c6e1a7b3d9f2e5c8a1b6d4f0e9c2a7b5d3f8e6c1a9b4d7f0"
blind_map_ref: "evidence/S00/blind-map.json"
expectation_policy: "all expectations MUST be null at freeze; filled only after measurement (whitepaper gold)"
spec_sources:
  - "MS Learn: Naming Files, Paths, and Namespaces (learn.microsoft.com/windows/win32/fileio/naming-a-file)"
  - "Unicode NormalizationTest.txt (T07/T08/T09)"
  - "BidiTest.txt (T12)"
  - "filename-reserved-regex (npm; CONIN$ agrees with arbitration B5)"

# ---- entry lists, pinned per language (workers may NOT self-select) ----
# T-API sub-cells (not counted in the 20): python 4 / go 4 / node 3 (军令 P3)
api_entry:
  node: [writeFileSync, createWriteStream, appendFileSync]
  python: [open_wb, os.mkdir, pathlib.write_bytes, os.rename]
  go: [os.Create, os.WriteFile, os.OpenFile, os.Mkdir]
  java: [Files.write, Files.createFile, Files.newOutputStream, Files.move]
  csharp: [File.WriteAllBytes, File.Create, FileStream, File.Move]
  rust: [std::fs::write, std::fs::File::create, std::fs::OpenOptions, std::fs::rename]

# 5 control cells (not counted in the 20); expectations ONLY from evidence/S00-ctrl-baseline.md
control_cells:
  - T-CTRL-NAMETOOLONG
  - T-CTRL-ASCII
  - T-CTRL-ILLEGAL-CHAR
  - T-CTRL-PARSE
  - T-CTRL-CANON

# rev6: the five control cells carried names but no pinned bytes, and six ports invented
# six samples. Measured in the rev5 run: T-CTRL-CANON alone arrived as canon-csharp.txt,
# canon-go-arm.txt, canon-python.txt and report-2026.txt, and two different payloads were
# hashed under the same cell id. A control cell that asks a different question per port
# cannot calibrate anything, so the bytes are pinned here. Names stay hex: a literal escape
# means six different things in six languages.
control_samples:
  - id: T-CTRL-ASCII
    sample_hex: "7265706f72742d323032362e747874"   # a legal ASCII name; every port must create it
    payload_hex: "53454e4447554152442d43414e4f4e2d5041594c4f41442d32303236"   # 'SENDGUARD-CANON-PAYLOAD-2026', 28 bytes, sha256 c9fe45b2...
    expectation: null
  - id: T-CTRL-ILLEGAL-CHAR
    sample_hex: "613c622e747874"   # illegal on Windows through the plain path form
    payload_hex: "53454e4447554152442d43414e4f4e2d5041594c4f41442d32303236"   # 'SENDGUARD-CANON-PAYLOAD-2026', 28 bytes, sha256 c9fe45b2...
    expectation: null
  - id: T-CTRL-PARSE
    sample_hex: "6e756c00627974652e747874"   # an embedded U+0000; a language may refuse before the OS
    payload_hex: "53454e4447554152442d43414e4f4e2d5041594c4f41442d32303236"   # 'SENDGUARD-CANON-PAYLOAD-2026', 28 bytes, sha256 c9fe45b2...
    expectation: null
  - id: T-CTRL-NAMETOOLONG
    sample_hex: ""   # a 256-code-unit single component: must fail after reaching the FS
    payload_hex: "53454e4447554152442d43414e4f4e2d5041594c4f41442d32303236"   # 'SENDGUARD-CANON-PAYLOAD-2026', 28 bytes, sha256 c9fe45b2...
    expectation: null
  - id: T-CTRL-CANON
    sample_hex: "63616e6f6e2d636865636b2e747874"   # the canonical-payload cell; the payload is pinned below
    payload_hex: "53454e4447554152442d43414e4f4e2d5041594c4f41442d32303236"   # 'SENDGUARD-CANON-PAYLOAD-2026', 28 bytes, sha256 c9fe45b2...
    expectation: null
    # (payload pinned once for all five: the same 28 bytes every port must hand to the write)

