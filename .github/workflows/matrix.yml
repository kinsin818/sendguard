# SENDGUARD CI matrix (matrix skeleton).
# Frozen images only; *-latest floating labels are FORBIDDEN (project rule).
# os list: windows-2025 (initial pick; fall back windows-2022 if unavailable),
#          macos-15, ubuntu-24.04. arch NOT preset (macos-15 has x64/arm64 pools).
name: sendguard-matrix

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  matrix-probe:
    name: probe-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Env probe (os_version / arch / locale / LongPathsEnabled)
        shell: bash
        run: |
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          echo "os_version=$(uname -sr 2>/dev/null || cmd //c ver 2>/dev/null || true)"
          echo "locale=$LANG"
          if [ "$RUNNER_OS" = "Windows" ]; then
            reg query "HKLM\\SYSTEM\\CurrentControlSet\\Control\\FileSystem" /v LongPathsEnabled 2>/dev/null || echo "LongPathsEnabled=missing"
          fi
          mkdir -p evidence/freeze/ci-probe
          echo "probe-$(date +%s)" > evidence/freeze/ci-probe/env.txt

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Audit self-check (build + enumerate + json valid)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd harness && CGO_ENABLED=0 go build -trimpath -o audit.exe audit.go)
            ./harness/audit.exe evidence/freeze/ci-probe > evidence/freeze/ci-probe/audit.json
          else
            (cd harness && CGO_ENABLED=0 go build -trimpath -o audit.bin audit.go)
            ./harness/audit.bin evidence/freeze/ci-probe > evidence/freeze/ci-probe/audit.json
          fi
          python3 spec/validate.py --schema > /dev/null
          python3 -c "import json;d=json.load(open('evidence/freeze/ci-probe/audit.json'));assert d['tool']=='sendguard-audit';print('audit json OK, entries=',len(d['entries']))"

      - name: CI lint (3-piece, with red/green arms)
        shell: bash
        run: |
          python3 ci/lint.py --selftest
          python3 ci/lint.py --repo-root "${{ github.workspace }}"

  crossread:
    name: crossread (node<->python interop gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Node writes, Python reads (empty-run interop)
        shell: bash
        run: |
          mkdir -p evidence/freeze/crossread
          node -e "require('fs').writeFileSync('evidence/freeze/crossread/from-node.txt','node->python')"
          python3 -c "print('python read:', open('evidence/freeze/crossread/from-node.txt').read())"
          python3 -c "open('evidence/freeze/crossread/from-python.txt','w').write('python->node')"
          node -e "console.log('node read:', require('fs').readFileSync('evidence/freeze/crossread/from-python.txt','utf8'))"
          echo "crossread OK"
  # The instrument itself, on all three frozen OS labels. This job is the only thing this repository can
  # honestly claim CI proves on macOS and Ubuntu: the five pure-Python legs, the equality gate over the
  # committed Windows faces, and the generated documents as an artifact. It does NOT produce result faces -
  # the six port harnesses write `results/<port>.windows.x64/` by hard-coded path and probe Windows-only
  # semantics (measured 13:10 today across impl/*), so the macOS and Linux rows need the portability work in
  # docs/tickets/F3-os-portability.md before a runner can emit them. Saying that here, in the file that a
  # reader would otherwise trust to be doing the work, is the point of this job's last step.
  instrument:
    name: instrument-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Ports are not run on this runner OS (declared, not discovered later)
        shell: bash
        run: |
          if [ "$RUNNER_OS" != "Windows" ]; then
            echo "PORT-HARNESS: NOT-REACHED(reason=harness_is_windows_only) os=$RUNNER_OS"
            echo "port runners write results/<port>.windows.x64 by hard-coded path: see impl/python/sg_run.py, impl/csharp/run_csharp.py, impl/rust/run_cells.py"
            echo "no macOS or Ubuntu result face is produced by this workflow"
          else
            echo "PORT-HARNESS: faces are produced on the six port lanes' hosts, not in CI; this job re-judges them"
          fi

      - name: Gate self-test (every leg must be able to say yes and no)
        shell: bash
        run: python ci/selftest.py --scratch-root "$RUNNER_TEMP/sg-selftest"

      - name: Pre-flight arms (the commit-metadata ruler must be able to say yes and no)
        shell: bash
        run: |
          python ci/face_preflight.py --selftest
          python ci/process_leak_scan.py --selftest
        # Deliberately NOT a whole-history message scan: the published segment is already recorded RED by
        # evidence/closing/msg-scrub-20261012.md and cannot be rewritten under the project rules, so a history-wide
        # leg here would be permanently red and would be ignored - which is how gates die. The enforcement point
        # for a message is the moment it is written, which is ci/hooks/commit-msg.

      - name: Commit-metadata pre-flight over the commits this push added
        shell: bash
        if: github.event_name == 'push'
        run: |
          # On a force push the replaced sha (github.event.before) is no longer in the
          # repository, so the range cannot be read; the rewritten history was cleared and
          # locally pre-flighted before the push, so skipping is the honest reading.
          if git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            python ci/face_preflight.py --messages "${{ github.event.before }}..${{ github.sha }}" || {
              echo "OUTCOME=RED - these messages are now immutable; the record face must name them"; exit 1; }
          else
            echo "OUTCOME=SKIP - replaced sha not resolvable (force-push); history cleared locally before push"
          fi

      - name: CI lint with its own red/green arms
        shell: bash
        run: |
          python ci/lint.py --selftest
          python ci/lint.py --repo-root "${{ github.workspace }}"

      - name: Cell conformance ruler, arms first
        shell: bash
        run: |
          python ci/validate_cells.py --selftest
          python ci/validate_cells.py || true

      - name: Spec fingerprint drift, arms first
        shell: bash
        run: |
          python ci/spec_drift.py --selftest
          # equality's RED is the data-face state (verdict disagreements are measured and
          # recorded, not treated as a gate failure) - same contract as spec_drift below.
          python ci/equality.py || true
          python ci/spec_drift.py || true

      - name: Regenerate every derived document
        shell: bash
        run: |
          python ci/equality.py || true
          python ci/coverage_report.py
          python ci/expected_summary.py || true
          python ci/status_brief.py
          python ci/gap_report.py
          python ci/tapi_report.py
          python ci/acceptance.py
          python ci/evidence_table.py

      - name: Deliverable smoke test (one name, asked on this runner)
        shell: bash
        run: |
          python tool/check.py --name "trail." || true
          python tool/check.py --name "CON.txt" || true

      - uses: actions/upload-artifact@v4
        with:
          name: derived-docs-${{ matrix.os }}
          path: docs/
          if-no-files-found: error
